syntax = "proto3";

package auth.v1;

service PasswordService {
    rpc StorePassword(StorePasswordRequest) returns (StorePasswordResponse) {};
    rpc VerifyPassword(VerifyPasswordRequest) returns (VerifyPasswordResponse) {};
    rpc GetChangePasswordToken(GetChangePasswordTokenRequest) returns (GetChangePasswordTokenResponse) {};
    rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {};
}


message StorePasswordRequest {
    string user_id = 1;
    string password = 2;
}
message StorePasswordResponse {
    bool is_stored = 1;
}


message VerifyPasswordRequest {
    string email = 1;
    string password = 2;
}
message VerifyPasswordResponse {
    bool is_valid = 1;
}


message GetChangePasswordTokenRequest {
    string user_id = 1;
}
message GetChangePasswordTokenResponse {
    string token = 1;
}


message ChangePasswordRequest {
    string user_id = 1;
    string token = 2;
    string old_password = 3;
    string new_password = 4;
}
message ChangePasswordResponse {
    bool is_changed = 1;
}